<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Celebrity Baby Deluxe · Jugador</title><link rel="stylesheet" href="deluxe.css"><style>body{display:grid;min-height:100vh;place-items:center;padding:20px}.card{width:min(100%,490px);text-align:center;padding:30px}.brand{font-size:2rem;margin:8px 0 10px}.card input{margin:7px 0}.card button{width:100%;margin-top:12px}.score{position:fixed;right:16px;top:16px;padding:10px 14px}.board{position:relative;width:min(72vw,310px);aspect-ratio:1;margin:18px auto;border-radius:18px;overflow:hidden;background:#0b0916}.board img{width:100%;height:100%;object-fit:cover}.grid{position:absolute;inset:0;display:grid}.tile{background:var(--tile,#7c4dff);border:1px solid #ffffff40;transition:.4s}.tile.reveal{opacity:0;transform:scale(.84)}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{min-height:62px}.option.selected{background:var(--aqua);color:#100d20}.waiting{padding:50px 0;color:var(--muted)}.result h1{font:700 2rem 'Space Grotesk';margin:0}.timer{color:var(--aqua);font-weight:800;margin:10px}.hidden{display:none!important}</style></head><body><div class="app-bg" id="bg"></div><div id="score" class="score glass hidden">0 pts</div><main id="login" class="card glass"><div class="eyebrow">Celebrity Baby Deluxe</div><h1 class="brand">¿Quién es?</h1><p>Escribe tu apodo para entrar a la sala.</p><input id="pin" placeholder="PIN de sala" inputmode="numeric" maxlength="4"><input id="name" placeholder="Tu apodo" maxlength="16"><button id="join" class="primary">Entrar a jugar</button></main><main id="play" class="card glass hidden"><span id="state" class="status">Esperando</span><div id="waiting" class="waiting">El anfitrión está preparando la ronda…</div><section id="round" class="hidden"><div class="timer" id="timer"></div><div class="board"><img id="image" alt="Imagen de la ronda"><div id="grid" class="grid"></div></div><div id="options" class="options"></div></section><section id="result" class="result hidden"><h1 id="title">¡Correcto!</h1><p id="message"></p></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getDatabase,ref,onValue,set,get,child,update}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js';const fb={apiKey:'AIzaSyBUDLHNHmourA_rDwa01-GUkqE06mE6hfs',authDomain:'celebrity-baby-35179.firebaseapp.com',databaseURL:'https://celebrity-baby-35179-default-rtdb.firebaseio.com',projectId:'celebrity-baby-35179'},db=getDatabase(initializeApp(fb));const $=x=>document.getElementById(x),query=new URLSearchParams(location.search);let room=sessionStorage.getItem('cbRoom'),id=sessionStorage.getItem('cbId'),score=0,selected=-1,scored=false,key='',timer;$('pin').value=query.get('room')||'';if(room&&id)connect();$('join').onclick=async()=>{let p=$('pin').value.trim(),n=$('name').value.trim().toUpperCase();if(p.length!==4||n.length<2)return alert('Completa el PIN y tu apodo.');let s=await get(child(ref(db),`activacion_arcade/salas/${p}`));if(!s.exists())return alert('No encontramos esa sala.');room=p;id='p_'+crypto.randomUUID().slice(0,8);sessionStorage.setItem('cbRoom',room);sessionStorage.setItem('cbId',id);await set(ref(db,`activacion_arcade/salas/${room}/jugadores/${id}`),{nombre:n,puntaje:0});connect()};function connect(){$('login').classList.add('hidden');$('play').classList.remove('hidden');$('score').classList.remove('hidden');onValue(ref(db,`activacion_arcade/salas/${room}/jugadores/${id}/puntaje`),s=>{score=s.val()||0;$('score').textContent=score+' pts'});onValue(ref(db,`activacion_arcade/salas/${room}`),s=>render(s.val()))}function render(d){if(!d)return;let q=d.pregunta_actual||{},c=d.config||{};document.documentElement.style.setProperty('--tile',c.tileColor||'#7c4dff');$('bg').style.backgroundImage=c.backgroundImage?`url(${c.backgroundImage})`:'';$('state').textContent=({lobby:'Sala abierta',idle:'Siguiente ronda',playing:'En juego',paused:'En pausa',revealed:'Respuesta',ranking:'Ranking'})[d.estado]||'Esperando';let fresh=(q.startTime||'')+q.image;if(fresh!==key){key=fresh;selected=-1;scored=false;build(q)}let active=['playing','paused'].includes(d.estado);$('waiting').classList.toggle('hidden',active||['revealed','ranking'].includes(d.estado));$('round').classList.toggle('hidden',!active);$('result').classList.toggle('hidden',!['revealed','ranking'].includes(d.estado));if(active){(q.revealedBlocks||[]).forEach(i=>document.querySelector(`[data-i="${i}"]`)?.classList.add('reveal'));clearInterval(timer);timer=setInterval(()=>{$('timer').textContent=d.estado==='paused'?'Pausa':Math.max(0,Math.ceil(((q.totalTimeSecs||0)*1000-(Date.now()-(q.startTime||Date.now())))/1000))+' segundos'},300)}if(d.estado==='revealed')finish(q);if(d.estado==='ranking'){$('title').textContent='Mira la pantalla';$('message').textContent='El ranking está listo.'}}function build(q){if(!q.image)return;$('image').src=q.image;let n=q.gridSize||6;$('grid').style.gridTemplateColumns=`repeat(${n},1fr)`;$('grid').innerHTML=Array.from({length:n*n},(_,i)=>`<i class="tile" data-i="${i}"></i>`).join('');$('options').innerHTML=(q.opciones||[]).map((o,i)=>`<button class="option" data-i="${i}">${o}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(selected>=0)return;selected=+b.dataset.i;b.classList.add('selected')})}function finish(q){clearInterval(timer);$('round').classList.add('hidden');if(scored)return;scored=true;if(selected===q.correcta){let pts=Math.max(100,Math.floor(1000*(1-(Date.now()-(q.startTime||Date.now()))/((q.totalTimeSecs||1)*1000))));$('title').textContent='¡Correcto!';$('message').textContent='+'+pts+' puntos';update(ref(db,`activacion_arcade/salas/${room}/jugadores/${id}`),{puntaje:score+pts})}else{$('title').textContent=selected<0?'Tiempo agotado':'Casi';$('message').textContent='La respuesta está en pantalla.'}}</script></body></html>
