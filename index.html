<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Celebrity Baby Deluxe · Jugador</title><link rel="stylesheet" href="deluxe.css"><style>
body{display:grid;min-height:100vh;place-items:center;padding:20px}.card{width:min(100%,490px);text-align:center;padding:30px}.brand{font-size:2rem;margin:8px 0 10px}.card input{margin:7px 0}.card button{width:100%;margin-top:12px}.score{position:fixed;right:16px;top:16px;padding:10px 14px}.board{position:relative;width:min(72vw,310px);aspect-ratio:1;margin:18px auto;border-radius:18px;overflow:hidden;background:#0b0916}.board img{width:100%;height:100%;object-fit:cover}.grid{position:absolute;inset:0;display:grid}.tile{background:var(--tile,#7c4dff);border:1px solid #ffffff40;transition:.4s}.tile.reveal{opacity:0;transform:scale(.84)}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{min-height:62px;border:2px solid #ffffff22;background:#ffffff12;transition:transform .16s,background .16s,border-color .16s,box-shadow .16s}.option.selected,.option.selected:hover:not(:disabled){background:var(--answer-bg,#ffd41f);border-color:#fff4ad;color:var(--answer-text,#1d1600);box-shadow:0 0 0 3px #ffd41f66,0 10px 22px #ffd41f33;transform:translateY(-2px);font-weight:900}.waiting{padding:50px 0;color:var(--muted)}.result{transition:.25s}.result h1{font:700 2rem 'Space Grotesk';margin:0}.result.incorrect{margin-top:16px;padding:16px;border:2px solid #ff315d;background:#ff315d18;box-shadow:0 0 0 4px #ff315d24,0 16px 40px #ff315d30;animation:wrong .42s ease}.result.incorrect h1{color:#ff7190}.correct-answer{font:800 1.35rem 'Space Grotesk';color:var(--aqua);margin:.3rem 0}.timer{color:var(--aqua);font-weight:800;margin:10px}.hidden{display:none!important}@keyframes wrong{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
</style></head><body><div class="app-bg" id="bg"></div><div id="score" class="score glass hidden">0 pts</div><main id="login" class="card glass"><h1 class="brand">¿Cuál es tu nombre?</h1><p>Escribe tu apodo para entrar a la sala.</p><input id="pin" placeholder="PIN de sala" inputmode="numeric" maxlength="4"><input id="name" placeholder="Tu apodo" maxlength="16"><button id="join" class="primary">Entrar a jugar</button><p id="loginMessage" role="status"></p></main>
<main id="play" class="card glass hidden"><span id="state" class="status">Esperando</span><div id="waiting" class="waiting">El anfitrión está preparando la ronda…</div><section id="round" class="hidden"><div class="timer" id="timer"></div><div class="board"><img id="image" alt="Imagen de la ronda"><div id="grid" class="grid"></div></div><div id="options" class="options"></div><p id="answerStatus" role="status" style="font-size:.8rem"></p></section><section id="result" class="result hidden"><h1 id="title">¡Correcto!</h1><p id="correctAnswer" class="correct-answer"></p><p id="message"></p></section></main>
<script type="module" src="player.js"></script></body></html>
