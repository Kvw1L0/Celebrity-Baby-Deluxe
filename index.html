<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Celebrity Baby Deluxe · Jugador</title><link rel="stylesheet" href="deluxe.css"><style>
body{display:grid;min-height:100vh;place-items:center;padding:20px}.card{width:min(100%,490px);text-align:center;padding:30px}.brand{font-size:2rem;margin:8px 0 10px}.card input{margin:7px 0}.card button{width:100%;margin-top:12px}.score{position:fixed;right:16px;top:16px;padding:10px 14px}.board{position:relative;width:min(72vw,310px);aspect-ratio:1;margin:18px auto;border-radius:18px;overflow:hidden;background:#0b0916}.board img{width:100%;height:100%;object-fit:cover}.grid{position:absolute;inset:0;display:grid}.tile{background:var(--tile,#7c4dff);border:1px solid #ffffff40;transition:.4s}.tile.reveal{opacity:0;transform:scale(.84)}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{min-height:62px;border:2px solid #ffffff22;background:#ffffff12;transition:transform .16s,background .16s,border-color .16s,box-shadow .16s}.option.selected{background:linear-gradient(135deg,#54e6d2,#2da8ff);border-color:#dffff9;color:#071a24;box-shadow:0 0 0 3px #54e6d257,0 10px 22px #54e6d236;transform:translateY(-2px);font-weight:900}.waiting{padding:50px 0;color:var(--muted)}.result{transition:.25s}.result h1{font:700 2rem 'Space Grotesk';margin:0}.result.incorrect{margin-top:16px;padding:16px;border:2px solid #ff315d;background:#ff315d18;box-shadow:0 0 0 4px #ff315d24,0 16px 40px #ff315d30;animation:wrong .42s ease}.result.incorrect h1{color:#ff7190}.correct-answer{font:800 1.35rem 'Space Grotesk';color:var(--aqua);margin:.3rem 0}.timer{color:var(--aqua);font-weight:800;margin:10px}.hidden{display:none!important}@keyframes wrong{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
</style></head><body><div class="app-bg" id="bg"></div><div id="score" class="score glass hidden">0 pts</div><main id="login" class="card glass"><img src="logo_bloque.png" alt="Celebrity Baby" style="width:72px;height:72px;object-fit:contain"><div class="eyebrow">Celebrity Baby Deluxe</div><h1 class="brand">¿Quién es?</h1><p>Escribe tu apodo para entrar a la sala.</p><input id="pin" placeholder="PIN de sala" inputmode="numeric" maxlength="4"><input id="name" placeholder="Tu apodo" maxlength="16"><button id="join" class="primary">Entrar a jugar</button></main>
<main id="play" class="card glass hidden"><span id="state" class="status">Esperando</span><div id="waiting" class="waiting">El anfitrión está preparando la ronda…</div><section id="round" class="hidden"><div class="timer" id="timer"></div><div class="board"><img id="image" alt="Imagen de la ronda"><div id="grid" class="grid"></div></div><div id="options" class="options"></div></section><section id="result" class="result hidden"><h1 id="title">¡Correcto!</h1><p id="correctAnswer" class="correct-answer"></p><p id="message"></p></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getDatabase,ref,onValue,set,get,child,update}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js';
const fb={apiKey:'AIzaSyBUDLHNHmourA_rDwa01-GUkqE06mE6hfs',authDomain:'celebrity-baby-35179.firebaseapp.com',databaseURL:'https://celebrity-baby-35179-default-rtdb.firebaseio.com',projectId:'celebrity-baby-35179'},db=getDatabase(initializeApp(fb));const $=x=>document.getElementById(x),query=new URLSearchParams(location.search);let room=sessionStorage.getItem('cbRoom'),id=sessionStorage.getItem('cbId'),score=0,selected=-1,selectedAt=0,key='',timer;$('pin').value=query.get('room')||'';if(room&&id)connect();
$('join').onclick=async()=>{let p=$('pin').value.trim(),n=$('name').value.trim().toUpperCase();if(p.length!==4||n.length<2)return alert('Completa el PIN y tu apodo.');let s=await get(child(ref(db),`activacion_arcade/salas/${p}`));if(!s.exists())return alert('No encontramos esa sala.');room=p;id='p_'+crypto.randomUUID().slice(0,8);sessionStorage.setItem('cbRoom',room);sessionStorage.setItem('cbId',id);await set(ref(db,`activacion_arcade/salas/${room}/jugadores/${id}`),{nombre:n,puntaje:0});connect()};
function connect(){$('login').classList.add('hidden');$('play').classList.remove('hidden');$('score').classList.remove('hidden');onValue(ref(db,`activacion_arcade/salas/${room}/jugadores/${id}/puntaje`),s=>{score=s.val()||0;$('score').textContent=score+' pts'});onValue(ref(db,`activacion_arcade/salas/${room}`),s=>render(s.val()))}
function render(d){if(!d)return;let q=d.pregunta_actual||{},c=d.config||{};document.documentElement.style.setProperty('--tile',c.tileColor||'#7c4dff');$('bg').style.backgroundImage=c.backgroundImage?`url(${c.backgroundImage})`:'';$('state').textContent=({lobby:'Sala abierta',idle:'Siguiente ronda',playing:'En juego',paused:'En pausa',revealed:'Respuesta',ranking:'Ranking',final:'Final'})[d.estado]||'Esperando';let fresh=(q.id||q.startTime||'')+q.image;if(fresh!==key){key=fresh;selected=-1;selectedAt=0;build(q)}let active=['playing','paused'].includes(d.estado),revealed=d.estado==='revealed';$('waiting').classList.toggle('hidden',active||revealed||['ranking','final'].includes(d.estado));$('round').classList.toggle('hidden',!(active||revealed));$('result').classList.toggle('hidden',!(revealed||['ranking','final'].includes(d.estado)));$('options').classList.toggle('hidden',!active);if(active){showTiles(q,false);clearInterval(timer);timer=setInterval(()=>{$('timer').textContent=d.estado==='paused'?'Pausa':Math.max(0,Math.ceil(((q.totalTimeSecs||0)*1000-(Date.now()-(q.startTime||Date.now())))/1000))+' segundos'},300)}if(revealed){clearInterval(timer);showTiles(q,true);finish(q)}if(['ranking','final'].includes(d.estado)){$('result').classList.remove('incorrect');$('title').textContent=d.estado==='final'?'¡Juego terminado!':'Mira la pantalla';$('correctAnswer').textContent='';$('message').textContent=d.estado==='final'?'El podio final está en la pantalla gigante.':'El ranking está listo.'}}
function build(q){if(!q.image)return;$('image').src=q.image;let n=q.gridSize||6;$('grid').style.gridTemplateColumns=`repeat(${n},1fr)`;$('grid').innerHTML=Array.from({length:n*n},(_,i)=>`<i class="tile" data-i="${i}"></i>`).join('');$('options').innerHTML=(q.opciones||[]).map((o,i)=>`<button class="option" data-i="${i}">${o}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=async()=>{selected=+b.dataset.i;selectedAt=Date.now();document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));if(q.id)await update(ref(db,`activacion_arcade/salas/${room}/jugadores/${id}`),{[`respuestas/${q.id}`]:{opcion:selected,at:selectedAt}})})}
function showTiles(q,all){(all?Array.from(document.querySelectorAll('.tile')).map((_,i)=>i):(q.revealedBlocks||[])).forEach(i=>document.querySelector(`[data-i="${i}"]`)?.classList.add('reveal'))}
function finish(q){$('correctAnswer').textContent=q.opciones?.[q.correcta]||'';let correct=selected===q.correcta;$('result').classList.toggle('incorrect',!correct);if(correct){let pts=Math.max(100,Math.floor(1000*(1-((selectedAt||Date.now())-(q.startTime||Date.now()))/((q.totalTimeSecs||1)*1000))));$('title').textContent='¡Correcto!';$('message').textContent='+'+pts+' puntos'}else{navigator.vibrate?.([90,45,120,45,220]);$('title').textContent='Incorrecto';$('message').textContent=selected<0?'No alcanzaste a responder.':'La respuesta correcta es:'}}
</script></body></html>
