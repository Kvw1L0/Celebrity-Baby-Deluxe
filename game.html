<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celebrity Baby Deluxe · Pantalla</title><link rel="stylesheet" href="deluxe.css"><style>
body{min-height:100vh;display:grid;place-items:center;overflow:hidden}.stage{text-align:center;width:min(92vw,1160px)}.pin{font:700 clamp(4rem,12vw,10rem) 'Space Grotesk';margin:0;letter-spacing:-.08em}.lobby-grid{display:grid;grid-template-columns:1fr 260px;gap:34px;align-items:center;max-width:900px;margin:30px auto;text-align:left}.lobby-copy{padding:35px}.lobby-copy .hint{font-size:1.2rem}.qr{background:#fff;padding:14px;border-radius:18px;width:260px}.qr img{width:100%;display:block}.people{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;margin:20px auto}.person{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:#ffffff16;border:1px solid #ffffff22;font-weight:700}.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:.7rem;background:linear-gradient(135deg,#7c4dff,#ff4fa3)}.board{position:relative;width:min(65vh,64vw);aspect-ratio:1;margin:14px auto;border-radius:25px;overflow:hidden;box-shadow:0 30px 90px #000a}.board img{width:100%;height:100%;object-fit:cover}.grid{position:absolute;inset:0;display:grid}.tile{background:var(--tile,#7c4dff);border:1px solid #ffffff34;transition:opacity .42s,transform .42s}.tile.reveal{opacity:0;transform:scale(.84)}.hint{color:var(--muted);font-size:clamp(1rem,2vw,1.5rem)}.answer{font:700 clamp(2rem,5vw,5rem) 'Space Grotesk';margin:.3rem;color:var(--aqua)}.ranking{display:grid;gap:10px;width:min(920px,94vw);margin:22px auto}.rank{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:18px;padding:16px 22px;text-align:left;animation:rank-in .45s both}.rank-place{font:900 clamp(1.6rem,4vw,3rem) 'Space Grotesk';color:var(--aqua);text-align:center}.rank-name{font:800 clamp(1.1rem,2.5vw,1.8rem) 'Space Grotesk'}.rank-points{font:800 clamp(1.1rem,2.4vw,1.7rem) 'Space Grotesk';color:var(--aqua)}.podium{margin:10px auto 18px}.winner{font:900 clamp(2.4rem,7vw,6rem) 'Space Grotesk';margin:0;background:linear-gradient(90deg,#fff1a8,#54e6d2,#ff8bc4);color:transparent;background-clip:text}.winner-label{font-weight:900;letter-spacing:.15em;color:#fff1a8}.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-6vh;width:10px;height:18px;animation:fall 2.8s linear forwards}@keyframes rank-in{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translateY(115vh) rotate(760deg)}}@media(max-width:700px){.lobby-grid{grid-template-columns:1fr;text-align:center}.qr{margin:auto}.rank{grid-template-columns:48px 1fr auto;padding:12px}}

/* Same proportions, typography and gold treatment as Bachillerato Party. */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
body{font-family:'Plus Jakarta Sans',sans-serif}.app-bg{background:#999}.app-bg:after{background:transparent;backdrop-filter:none}
.stage{width:min(1152px,92vw)}.lobby-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;max-width:none;margin:0;align-items:center}
.join-stack{display:flex;flex-direction:column;align-items:center;gap:24px;min-width:0}
.qr{width:min(100%,62vh);padding:36px;border-radius:24px;filter:drop-shadow(0 0 35px #fbbf2499)}.qr img{width:100%;aspect-ratio:1;object-fit:contain}
.pin-card{max-width:100%;padding:16px 40px;border:2px solid #fbbf24;border-radius:24px;text-align:center;background:linear-gradient(90deg,#000d,#451a0380,#000d);box-shadow:0 0 35px #fbbf2466}
.pin-card>span{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;color:#cbd5e1}
.pin{font:900 clamp(40px,5vw,72px)/1.15 'Outfit',sans-serif;letter-spacing:.14em;color:#fcd34d;margin:0;padding-left:.14em;white-space:nowrap}
.players-panel{height:min(580px,68vh);padding:32px;background:#0006;border:1px solid #ffffff26;border-radius:24px;backdrop-filter:blur(20px);display:flex;flex-direction:column;min-width:0;text-align:left}
.players-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ffffff1a;padding-bottom:12px;margin-bottom:16px}
.players-heading h2{display:flex;align-items:center;gap:8px;font:800 20px 'Outfit',sans-serif;margin:0;color:#fff}.players-heading svg{width:20px;height:20px;fill:none;stroke:#fbbf24;stroke-width:1.7;flex:none}
#playerCount{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;color:#fcd34d;background:#fbbf2433}
.people{display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:flex-start;gap:12px;overflow-y:auto;flex:1;margin:0;max-width:none;padding-right:8px}
.empty-players{font-size:14px;color:#bac4d3;font-style:italic;text-align:center;width:100%;padding:24px 0;margin:0}
.person{align-self:flex-start;max-width:100%;overflow-wrap:anywhere}.avatar{flex:none}
.ranking{max-height:62vh;overflow:auto}.rank{animation:none}.rank-name{overflow-wrap:anywhere;min-width:0}
.closed-card{max-width:520px;margin:auto;padding:40px;border:1px solid #ffffff33;border-radius:24px;background:#0009}.closed-card h1{font:800 32px 'Outfit';color:#fff}.closed-card p{color:#ddd}.lock{font-size:60px}
#fullscreen{position:fixed;right:24px;top:16px;border:1px solid #ffffff33;background:#ffffff1a;padding:8px 12px;font-size:24px;z-index:5}
@media(max-height:740px) and (min-width:701px){.qr{width:min(100%,59vh);padding:24px}.join-stack{gap:16px}.pin-card{padding:10px 30px}.pin{font-size:54px}.players-panel{height:72vh}}
@media(max-width:700px){body{overflow:auto;padding:24px 0}.lobby-grid{grid-template-columns:1fr;gap:28px}.qr{width:min(78vw,400px);padding:24px}.pin{font-size:52px}.players-panel{height:360px;padding:24px}#fullscreen{right:8px;top:8px}.rank{grid-template-columns:40px minmax(0,1fr) auto;gap:10px}}
@media(prefers-reduced-motion:reduce){.confetti{display:none}.tile{transition:none}}
</style></head><body><div class="app-bg" id="bg"></div><div class="confetti" id="confetti"></div><button id="fullscreen" aria-label="Pantalla completa" title="Pantalla completa">⛶</button><main class="stage"><section id="closed" class="hidden"><div class="closed-card"><div class="lock">🔒</div><h1>Esperando nueva sala</h1><p>La pantalla se conectará cuando el anfitrión abra una sala.</p></div></section><section id="lobby"><div class="lobby-grid"><div class="join-stack"><div class="qr"><img id="qr" alt="QR para unirse a la sala"></div><div class="pin-card"><span>PIN DE SALA</span><h1 class="pin" id="pin">----</h1></div></div><div class="players-panel"><header class="players-heading"><h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/></svg>Jugadores en Sala</h2><span id="playerCount">0</span></header><div class="people" id="people" aria-live="polite"></div></div></div></section><section id="play" class="hidden"><div class="board"><img id="image" alt="Imagen de la ronda"><div class="grid" id="grid"></div></div><div class="hint" id="clock"></div></section><section id="answer" class="hidden"><div class="board"><img id="answerImage" alt="Imagen revelada"><div class="grid" id="answerGrid"></div></div><div class="answer" id="correct"></div></section><section id="ranking" class="hidden"><div id="podium" class="podium hidden"><div class="winner-label" id="winnerLabel">GANADOR/A</div><h1 id="winner" class="winner"></h1></div><h1 id="rankingTitle" class="brand" style="font-size:clamp(2.4rem,6vw,5rem);margin:8px">Ranking</h1><div class="ranking" id="list"></div></section></main>
<script type="module" src="screen.js"></script></body></html>
