<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celebrity Baby Deluxe · Pantalla</title><link rel="stylesheet" href="deluxe.css"><style>body{min-height:100vh;display:grid;place-items:center;overflow:hidden}.head{position:fixed;inset:28px 34px auto;display:flex;justify-content:space-between;align-items:center;width:auto;gap:20px}.head .brand{font-size:clamp(1.5rem,3vw,2.3rem)}.stage{text-align:center;width:min(92vw,1160px)}.pin{font:700 clamp(4rem,12vw,10rem) 'Space Grotesk';margin:0;letter-spacing:-.08em}.lobby-grid{display:grid;grid-template-columns:1fr 260px;gap:34px;align-items:center;max-width:900px;margin:30px auto;text-align:left}.lobby-copy{padding:35px}.lobby-copy .hint{font-size:1.2rem}.qr{background:#fff;padding:14px;border-radius:18px;width:260px}.qr img{width:100%;display:block}.people{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;margin:20px auto}.person{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:#ffffff16;border:1px solid #ffffff22;font-weight:700}.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:.7rem;background:linear-gradient(135deg,#7c4dff,#ff4fa3)}.board{position:relative;width:min(65vh,64vw);aspect-ratio:1;margin:14px auto;border-radius:25px;overflow:hidden;box-shadow:0 30px 90px #000a}.board img{width:100%;height:100%;object-fit:cover}.grid{position:absolute;inset:0;display:grid}.tile{background:var(--tile,#7c4dff);border:1px solid #ffffff34;transition:opacity .42s,transform .42s}.tile.reveal{opacity:0;transform:scale(.84)}.hint{color:var(--muted);font-size:clamp(1rem,2vw,1.5rem)}.answer{font:700 clamp(2rem,5vw,5rem) 'Space Grotesk';margin:.3rem}.ranking{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:900px;margin:26px auto}.rank{padding:20px;text-align:left}.rank b{font-size:1.4rem;display:block}.rank span{color:var(--aqua)}@media(max-width:700px){.lobby-grid{grid-template-columns:1fr;text-align:center}.qr{margin:auto}.head{inset:16px}.ranking{grid-template-columns:1fr}}</style></head><body><div class="app-bg" id="bg"></div><header class="head"><div><div class="eyebrow">Experiencia en vivo</div><div class="brand">Celebrity Baby Deluxe</div></div><span class="status" id="status">Sala abierta</span></header><main class="stage"><section id="lobby"><div class="lobby-grid"><div class="lobby-copy glass"><div class="eyebrow">Escanea y participa</div><h1 class="pin" id="pin">----</h1><p class="hint">Escanea el QR o ingresa este PIN en tu teléfono.</p></div><div class="qr"><img id="qr" alt="QR para unirse a la sala"></div></div><div class="eyebrow">Personas que ya están jugando</div><div class="people" id="people"><span class="hint">Esperando participantes…</span></div></section><section id="play" class="hidden"><div class="eyebrow">¿Quién es?</div><div class="board"><img id="image" alt="Imagen de la ronda"><div class="grid" id="grid"></div></div><div class="hint" id="clock"></div></section><section id="answer" class="hidden"><div class="eyebrow">La respuesta es</div><div class="answer" id="correct"></div></section><section id="ranking" class="hidden"><div class="eyebrow">Resultados de la sala</div><h1 class="brand" style="font-size:4rem;margin:8px">Ranking</h1><div class="ranking" id="list"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js';const fb={apiKey:'AIzaSyBUDLHNHmourA_rDwa01-GUkqE06mE6hfs',authDomain:'celebrity-baby-35179.firebaseapp.com',databaseURL:'https://celebrity-baby-35179-default-rtdb.firebaseio.com',projectId:'celebrity-baby-35179'},db=getDatabase(initializeApp(fb));const $=x=>document.getElementById(x),views=['lobby','play','answer','ranking'];let clock;const initials=n=>(n||'?').slice(0,2).toUpperCase();onValue(ref(db,'activacion_arcade/sala_activa'),s=>{if(s.val())onValue(ref(db,`activacion_arcade/salas/${s.val()}`),x=>show(s.val(),x.val()))});function show(pin,d={}){let q=d.pregunta_actual||{},c=d.config||{},join=c.joinUrl||location.origin+'/?room='+pin;$('pin').textContent=pin;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(join);document.documentElement.style.setProperty('--tile',c.tileColor||'#7c4dff');$('bg').style.backgroundImage=c.backgroundImage?`url(${c.backgroundImage})`:'';$('status').textContent=({lobby:'Sala abierta',idle:'Ronda lista',playing:'En juego',paused:'En pausa',revealed:'Respuesta',ranking:'Ranking'})[d.estado]||'Sala abierta';let ps=Object.values(d.jugadores||{});$('people').innerHTML=ps.length?ps.map(p=>`<span class="person"><span class="avatar">${initials(p.nombre)}</span>${p.nombre}</span>`).join(''):'<span class="hint">Esperando participantes…</span>';views.forEach(v=>$(v).classList.add('hidden'));let v=['playing','paused'].includes(d.estado)?'play':d.estado==='revealed'?'answer':d.estado==='ranking'?'ranking':'lobby';$(v).classList.remove('hidden');if(v==='play'){build(q);(q.revealedBlocks||[]).forEach(i=>document.querySelector(`[data-i="${i}"]`)?.classList.add('reveal'));clearInterval(clock);clock=setInterval(()=>{$('clock').textContent=d.estado==='paused'?'Pausa':Math.max(0,Math.ceil(((q.totalTimeSecs||0)*1000-(Date.now()-(q.startTime||Date.now())))/1000))+' segundos'},300)}if(v==='answer'){$('correct').textContent=q.opciones?.[q.correcta]||'—';clearInterval(clock)}if(v==='ranking')$('list').innerHTML=ps.sort((a,b)=>b.puntaje-a.puntaje).slice(0,3).map((p,i)=>`<article class="rank glass"><span>#${i+1}</span><b>${p.nombre}</b>${p.puntaje||0} pts</article>`).join('')}function build(q){if($('image').src!==q.image)$('image').src=q.image;let n=q.gridSize||6;if($('grid').children.length!==n*n){$('grid').innerHTML='';$('grid').style.gridTemplateColumns=`repeat(${n},1fr)`;for(let i=0;i<n*n;i++)$('grid').insertAdjacentHTML('beforeend',`<i class="tile" data-i="${i}"></i>`)}}</script></body></html>
